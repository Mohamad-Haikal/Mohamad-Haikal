<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="332" viewBox="0 0 1200 332" role="img" aria-labelledby="title desc">
<title id="title">Mohamad Haikal | From interface to infrastructure</title>
<desc id="desc">A custom graphic banner featuring abstract engineering schematics, highlighting software development across user interfaces, APIs, and infrastructure.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090F1D"/><stop offset="1" stop-color="#102239"/></linearGradient>
 <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ADFC9"/><stop offset="1" stop-color="#FDBD6B"/></linearGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#37556D" opacity="0.28" stroke-width="0.8"/></pattern>
 <clipPath id="clip"><rect x="0" y="0" width="1200" height="332" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="332" fill="url(#bg)"/>
 <rect x="680" y="0" width="520" height="332" fill="url(#grid)" opacity="0.75"/>
 <path d="M0 0H1200V332H0Z" fill="none" stroke="#34475C" stroke-width="2"/>
 <path d="M40 43H1160" stroke="#34475C" stroke-width="1" opacity="0.8"/>
 <path d="M40 289H1160" stroke="#34475C" stroke-width="1" opacity="0.7"/>
 <g font-family="Arial, Helvetica, sans-serif">
  <rect x="43" y="14" width="50" height="21" rx="5" fill="#1C3345" stroke="#34475C"/>
  <text x="68" y="29" font-size="14" font-weight="700" text-anchor="middle" fill="#5ADFC9">MH</text>
  <text x="106" y="29" font-size="12" font-weight="700" letter-spacing="2" fill="#A5B6CA">MOHAMAD HAIKAL / ENGINEER &amp; DESIGNER</text>
  <text x="42" y="106" font-size="15" font-weight="700" letter-spacing="4" fill="#5ADFC9">DESIGN · BUILD · SHIP</text>
  <text x="40" y="170" font-size="60" font-weight="800" letter-spacing="-1.6" fill="#F4F8FC">From interface</text>
  <text x="40" y="232" font-size="60" font-weight="800" letter-spacing="-1.6" fill="#F4F8FC">to infrastructure<tspan fill="#FDBD6B">.</tspan></text>
  <rect x="42" y="256" width="308" height="3.5" rx="1.5" fill="url(#rule)"/>
  <text x="42" y="310" font-size="12" letter-spacing="2.3" fill="#A5B6CA">MOBILE  /  WEB &amp; APIs  /  PRODUCTION</text>
 </g>
 <!-- Graphic on right: modular product system, no illustrations or icons -->
 <g transform="translate(800 75)" font-family="Arial, Helvetica, sans-serif">
  <path d="M53 41H91M195 41H231M144 70V91M144 145V170" fill="none" stroke="#A5B6CA" stroke-width="2" stroke-dasharray="5 5" opacity="0.9"/>
  <rect x="8" y="16" width="106" height="53" rx="11" fill="#14263B" stroke="#34475C" stroke-width="1.8"/>
  <rect x="126" y="16" width="106" height="53" rx="11" fill="#14263B" stroke="#5ADFC9" stroke-width="2"/>
  <rect x="244" y="16" width="106" height="53" rx="11" fill="#14263B" stroke="#34475C" stroke-width="1.8"/>
  <text x="61" y="47" font-size="15" font-weight="700" text-anchor="middle" fill="#D2E4F0">UI / UX</text>
  <text x="179" y="47" font-size="15" font-weight="700" text-anchor="middle" fill="#5ADFC9">API</text>
  <text x="297" y="47" font-size="15" font-weight="700" text-anchor="middle" fill="#D2E4F0">DATA</text>
  <path d="M61 69V105H180M297 69V105H180" stroke="#A5B6CA" stroke-width="1.7" fill="none" opacity="0.8"/>
  <circle cx="180" cy="105" r="6" fill="#FDBD6B"/>
