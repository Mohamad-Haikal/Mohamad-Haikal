  <circle cx="103" cy="158" r="8" stroke="#FDBD6B" stroke-width="2" fill="none"/>
  <path d="M98 158L102 162L110 153" stroke="#FDBD6B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="135" y="164" font-size="16" font-weight="700" fill="#F4F8FC">DEPLOY / RUN</text>
  <path d="M180 184V196" stroke="#A5B6CA" stroke-width="1.5"/>
  <path d="M173 190L180 199L187 190" stroke="#A5B6CA" stroke-width="1.5" fill="none"/>
  <text x="180" y="219" font-size="11" text-anchor="middle" letter-spacing="2.6" fill="#A5B6CA">THE WHOLE PRODUCT</text>
 </g>
